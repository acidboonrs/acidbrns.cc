# Defense-in-depth for static subdomains. Include inside each static server block:
#     include /etc/nginx/snippets/static-hardening.conf;
#
# CSP allows: inline JS/CSS (the dev tools use it), Google Fonts, and https fetches
# (the DNS/headers tools call out to DoH / arbitrary URLs from the browser).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Block stray backup / editor / temp files from being served
location ~* (\.(bak|old|orig|save|swp|swo|tmp|dist)|~)$ { deny all; access_log off; log_not_found off; }
