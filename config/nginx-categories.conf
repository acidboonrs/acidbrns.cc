# =====================================================
# KATEGORIE-SUBDOMAINS - acidbrns.cc
# Anhängen an: /etc/nginx/sites-available/acidbrns-subdomains
# =====================================================

# ----- SECURITY -----
server {
    listen 80;
    listen [::]:80;
    server_name security.acidbrns.cc;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name security.acidbrns.cc;

    root /var/www/security;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/security.acidbrns.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/security.acidbrns.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/nginx/dhparam.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/security-access.log;
    error_log /var/log/nginx/security-error.log;
}

