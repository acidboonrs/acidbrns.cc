# =====================================================
# NGINX KONFIGURATION - XMPP Registration
# =====================================================
# Pfad: /etc/nginx/sites-available/xmpp-registration
# Symlink: ln -s /etc/nginx/sites-available/xmpp-registration /etc/nginx/sites-enabled/
# =====================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name acidbrns.cc upload.acidbrns.cc;

    # ACME Challenge für Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Alles andere auf HTTPS umleiten
    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================
# Gemeinsame Security-Header als Map
# (verhindert Duplizierung bei verschachtelten locations)
# =====================================================
# Wird als map außerhalb der server-Blöcke definiert — muss in nginx.conf
# im http-Kontext sein, nicht in sites-available. Als Alternative werden
# die Header in jedem Block explizit gesetzt (siehe unten).

# HTTPS Haupt-Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name acidbrns.cc;

    # Root Directory
    root /var/www/xmpp-registration/frontend;
    index index.html;

    # =====================================================
    # SSL/TLS KONFIGURATION (Let's Encrypt)
    # =====================================================

    ssl_certificate /etc/letsencrypt/live/acidbrns.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acidbrns.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    ssl_dhparam /etc/nginx/dhparam.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/acidbrns.cc/chain.pem;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # =====================================================
    # SICHERHEITS-HEADER
    # =====================================================

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; form-action 'self'; base-uri 'self'; frame-ancestors 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =====================================================
    # LOGS
    # =====================================================

    access_log /var/log/nginx/xmpp-registration-access.log;
    error_log /var/log/nginx/xmpp-registration-error.log;

    # =====================================================
    # LOCATIONS
    # =====================================================

    # API-Requests an Flask-Backend weiterleiten
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend statische Dateien
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache-Control für statische Assets
    # WICHTIG: add_header-Direktiven werden in verschachtelten locations
    # nicht vererbt. Alle Security-Header müssen hier wiederholt werden.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security-Header wiederholen (Nginx-Vererbungsregel)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =====================================================
# Subdomain für HTTP Upload (Prosody)
# =====================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upload.acidbrns.cc;

    ssl_certificate /etc/letsencrypt/live/acidbrns.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acidbrns.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/nginx/dhparam.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/acidbrns.cc/chain.pem;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/xmpp-upload-access.log;
    error_log /var/log/nginx/xmpp-upload-error.log;

    # Proxy zu Prosody HTTP Upload
    location / {
        proxy_pass http://127.0.0.1:5280;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 10M;
    }
}

