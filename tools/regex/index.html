<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Regex Tester – Reguläre Ausdrücke testen und Matches visualisieren">
    <meta name="theme-color" content="#00ff88">
    <title>Regex Tester – tools.acidbrns.cc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #09090b; --bg-secondary: #0f0f12; --bg-card: #131316; --text-primary: #fafafa; --text-secondary: #71717a; --text-muted: #52525b; --accent: #00ff88; --accent-glow: rgba(0,255,136,0.15); --border: #27272a; --red: #ff4444; --red-glow: rgba(255,68,68,0.1); --match-bg: rgba(0,255,136,0.2); --match-border: rgba(0,255,136,0.5); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); z-index: 1000; }
        .container { max-width: 860px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }
        header { padding: 2rem 0; border-bottom: 1px solid var(--border); }
        .header-content { display: flex; align-items: center; gap: 1rem; }
        .back-link { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); text-decoration: none; transition: all 0.2s ease; }
        .back-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .back-link svg { width: 18px; height: 18px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; color: var(--text-primary); text-decoration: none; }
        .logo-accent { color: var(--accent); }
        .logo-divider { color: var(--text-muted); font-weight: 400; }
        main { flex: 1; padding: 3rem 0; }
        .page-header { margin-bottom: 2rem; }
        .page-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .page-desc { color: var(--text-secondary); font-size: 0.9375rem; }
        .regex-input-row { display: flex; align-items: stretch; gap: 0; margin-bottom: 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color 0.2s; }
        .regex-input-row:focus-within { border-color: var(--accent); }
        .regex-delimiter { padding: 0.75rem 0.875rem; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; line-height: 1; background: var(--bg-secondary); user-select: none; display: flex; align-items: center; }
        .regex-input { flex: 1; background: transparent; border: none; padding: 0.75rem 0.5rem; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.9375rem; outline: none; }
        .flags-input { width: 80px; background: var(--bg-secondary); border: none; border-left: 1px solid var(--border); padding: 0.75rem 0.75rem; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.9375rem; outline: none; }
        .flags-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .flag-btn { padding: 0.375rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; cursor: pointer; transition: all 0.2s; }
        .flag-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .section-label { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
        textarea { width: 100%; min-height: 160px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; resize: vertical; outline: none; transition: border-color 0.2s; }
        textarea:focus { border-color: var(--accent); }
        .match-display { width: 100%; min-height: 160px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; white-space: pre-wrap; word-break: break-word; line-height: 1.7; overflow: auto; }
        mark { background: var(--match-bg); border: 1px solid var(--match-border); border-radius: 2px; color: var(--accent); padding: 0 1px; }
        .status { padding: 0.5rem 0.75rem; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; display: none; margin-bottom: 1rem; }
        .status.ok { background: var(--accent-glow); border: 1px solid rgba(0,255,136,0.2); color: var(--accent); display: block; }
        .status.err { background: var(--red-glow); border: 1px solid rgba(255,68,68,0.2); color: var(--red); display: block; }
        .matches-list { margin-top: 1.5rem; }
        .match-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.875rem 1rem; margin-bottom: 0.5rem; display: flex; gap: 1rem; align-items: flex-start; }
        .match-index { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); min-width: 50px; }
        .match-text { font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; color: var(--accent); flex: 1; word-break: break-all; }
        .match-pos { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
        .groups-list { margin-top: 0.375rem; display: flex; gap: 0.375rem; flex-wrap: wrap; }
        .group-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.6875rem; padding: 0.125rem 0.5rem; border-radius: 4px; background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.2); color: var(--text-secondary); }
        .replace-section { margin-top: 2rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
        .replace-section h3 { font-size: 0.9375rem; font-weight: 600; margin-bottom: 1rem; }
        .replace-row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem; }
        .replace-input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 0.625rem 0.75rem; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; outline: none; }
        .replace-input:focus { border-color: var(--accent); }
        .btn { padding: 0.625rem 1.25rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; cursor: pointer; transition: all 0.2s ease; }
        .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .replace-output { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; color: var(--text-secondary); min-height: 40px; word-break: break-word; white-space: pre-wrap; }
        footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: auto; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; }
        .copyright { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; color: var(--text-muted); }
        .footer-links a { font-size: 0.875rem; color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--accent); }
        @media (max-width: 640px) { .footer-content { flex-direction: column; gap: 1rem; } }
    </style>
</head>
<body>
    <div class="noise"></div>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="https://tools.acidbrns.cc" class="back-link" title="Zurück zu Tools">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                </a>
                <a href="https://tools.acidbrns.cc" class="logo"><span class="logo-accent">&gt;</span>acidbrns<span class="logo-divider">/</span>tools<span class="logo-divider">/</span>regex</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Regex Tester</h1>
                <p class="page-desc">Reguläre Ausdrücke live testen, Matches visualisieren und Gruppen anzeigen. Verwendet JavaScript-Regex-Engine.</p>
            </div>

            <div class="regex-input-row">
                <span class="regex-delimiter">/</span>
                <input type="text" class="regex-input" id="pattern" placeholder="[a-z]+" oninput="run()">
                <span class="regex-delimiter">/</span>
                <input type="text" class="flags-input" id="flags" value="gi" placeholder="gi" oninput="run()">
            </div>

            <div class="flags-row">
                <button class="flag-btn active" id="flag-g" onclick="toggleFlag('g')">g – global</button>
                <button class="flag-btn active" id="flag-i" onclick="toggleFlag('i')">i – ignoreCase</button>
                <button class="flag-btn" id="flag-m" onclick="toggleFlag('m')">m – multiline</button>
                <button class="flag-btn" id="flag-s" onclick="toggleFlag('s')">s – dotAll</button>
            </div>

            <div id="status" class="status"></div>

            <div class="section-label" style="margin-bottom:0.5rem">
                <span>Testtext</span>
            </div>
            <textarea id="testText" placeholder="Text eingeben..." oninput="run()">Hallo Welt! Dies ist ein Test-Text.
XMPP läuft auf Port 5222 und 5269.
E-Mail: test@acidbrns.cc</textarea>

            <div class="section-label" style="margin-top:1.5rem; margin-bottom:0.5rem">
                <span>Matches</span>
                <span id="matchCount" style="color:var(--accent)">0 Treffer</span>
            </div>
            <div class="match-display" id="matchDisplay"></div>

            <div class="matches-list" id="matchesList"></div>

            <div class="replace-section">
                <h3>Ersetzen</h3>
                <div class="replace-row">
                    <input type="text" class="replace-input" id="replaceWith" placeholder="Ersatztext (z.B. $1 für Gruppe 1)" oninput="doReplace()">
                    <button class="btn" onclick="doReplace()">Ersetzen</button>
                </div>
                <div class="replace-output" id="replaceOutput">–</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p class="copyright">© 2026 acidbrns.cc</p>
                <div class="footer-links"><a href="https://tools.acidbrns.cc">Alle Tools</a></div>
            </div>
        </div>
    </footer>

    <script>
        

        function getFlags() { return document.getElementById('flags').value; }
        function getPattern() { return document.getElementById('pattern').value; }

        function toggleFlag(f) {
            const input = document.getElementById('flags');
            let flags = input.value;
            if (flags.includes(f)) { flags = flags.replace(f, ''); }
            else { flags += f; }
            input.value = flags;
            document.getElementById('flag-' + f).classList.toggle('active', flags.includes(f));
            run();
        }

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function run() {
            const pattern = getPattern();
            const flags = getFlags();
            const text = document.getElementById('testText').value;
            const statusEl = document.getElementById('status');
            const countEl = document.getElementById('matchCount');
            const displayEl = document.getElementById('matchDisplay');
            const listEl = document.getElementById('matchesList');

            if (!pattern) {
                statusEl.className = 'status';
                countEl.textContent = '0 Treffer';
                displayEl.innerHTML = escHtml(text);
                listEl.innerHTML = '';
                return;
            }

            let re;
            try {
                re = new RegExp(pattern, flags.includes('g') ? flags : flags + 'g');
                statusEl.className = 'status';
            } catch(e) {
                statusEl.textContent = 'Regex-Fehler: ' + e.message;
                statusEl.className = 'status err';
                displayEl.innerHTML = escHtml(text);
                listEl.innerHTML = '';
                countEl.textContent = '0 Treffer';
                return;
            }

            const matches = [];
            let m;
            const singleRe = new RegExp(pattern, flags.replace('g',''));
            const globalRe = new RegExp(pattern, flags.includes('g') ? flags : flags + 'g');

            while ((m = globalRe.exec(text)) !== null) {
                matches.push({ index: m.index, text: m[0], groups: Array.from(m).slice(1) });
                if (!flags.includes('g')) break;
            }

            countEl.textContent = matches.length + (matches.length === 1 ? ' Treffer' : ' Treffer');

            // Highlight
            let highlighted = '';
            let lastIndex = 0;
            for (const match of matches) {
                highlighted += escHtml(text.slice(lastIndex, match.index));
                highlighted += '<mark>' + escHtml(match.text) + '</mark>';
                lastIndex = match.index + match.text.length;
            }
            highlighted += escHtml(text.slice(lastIndex));
            displayEl.innerHTML = highlighted;

            // Match list
            listEl.innerHTML = matches.slice(0, 50).map((match, i) => `
                <div class="match-item">
                    <span class="match-index">#${i+1}</span>
                    <div style="flex:1">
                        <div class="match-text">${escHtml(match.text)}</div>
                        ${match.groups.filter(g => g !== undefined).length ? `<div class="groups-list">${match.groups.filter(g => g !== undefined).map((g, gi) => `<span class="group-tag">$${gi+1}: ${escHtml(String(g))}</span>`).join('')}</div>` : ''}
                    </div>
                    <span class="match-pos">pos ${match.index}</span>
                </div>`).join('') + (matches.length > 50 ? `<div style="text-align:center;padding:0.75rem;color:var(--text-muted);font-family:JetBrains Mono,monospace;font-size:0.8125rem">... und ${matches.length - 50} weitere</div>` : '');

            doReplace();
        }

        function doReplace() {
            const pattern = getPattern();
            const flags = getFlags();
            const text = document.getElementById('testText').value;
            const replaceWith = document.getElementById('replaceWith').value;
            const output = document.getElementById('replaceOutput');

            if (!pattern) { output.textContent = '–'; return; }
            try {
                const re = new RegExp(pattern, flags);
                output.textContent = text.replace(re, replaceWith);
            } catch(e) {
                output.textContent = 'Fehler: ' + e.message;
            }
        }

        // Sync flag buttons on load
        ['g','i','m','s'].forEach(f => {
            document.getElementById('flag-'+f).classList.toggle('active', getFlags().includes(f));
        });

        run();
    </script>
</body>
</html>
