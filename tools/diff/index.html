<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Text Diff – zwei Texte vergleichen und Unterschiede hervorheben">
    <meta name="theme-color" content="#00ff88">
    <title>Text Diff – tools.acidbrns.cc</title>
<link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="https://acidbrns.cc/favicon.svg">
</head>
<body>
    <div class="noise"></div>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="https://tools.acidbrns.cc" class="back-link" title="Zurück zu Tools">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                </a>
                <a href="https://tools.acidbrns.cc" class="logo"><span class="logo-accent">&gt;</span>acidbrns<span class="logo-divider">/</span>tools<span class="logo-divider">/</span>diff</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">Text Diff</h1>
                <p class="page-desc">Zwei Texte vergleichen und Unterschiede zeilenweise hervorheben. Alles läuft lokal im Browser.</p>
            </div>

            <div class="editor-layout">
                <div>
                    <span class="panel-label">Original (A)</span>
                    <textarea id="textA" placeholder="Original-Text eingeben..."></textarea>
                </div>
                <div>
                    <span class="panel-label">Geändert (B)</span>
                    <textarea id="textB" placeholder="Geänderten Text eingeben..."></textarea>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" onclick="runDiff()">Vergleichen</button>
                <button class="btn btn-secondary" onclick="clearAll()">✕ Leeren</button>
                <button class="btn btn-secondary" onclick="swapTexts()">↕ Tauschen</button>
            </div>

            <div id="status" class="status"></div>
            <div id="diffOutput" style="display:none">
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot" style="background:var(--green-glow);border:1px solid rgba(0,255,136,0.3)"></div>Hinzugefügt</div>
                    <div class="legend-item"><div class="legend-dot" style="background:var(--red-glow);border:1px solid rgba(255,68,68,0.3)"></div>Entfernt</div>
                    <div class="legend-item"><div class="legend-dot" style="background:var(--bg-card);border:1px solid var(--border)"></div>Unverändert</div>
                </div>
                <div class="diff-output">
                    <div class="diff-header">
                        <span class="diff-stat">+<span class="added" id="addedCount">0</span> hinzugefügt</span>
                        <span class="diff-stat">-<span class="removed" id="removedCount">0</span> entfernt</span>
                        <span class="diff-stat" id="unchangedStat"></span>
                    </div>
                    <div id="diffLines"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p class="copyright">© 2026 acidbrns.cc</p>
                <div class="footer-links"><a href="https://tools.acidbrns.cc">Alle Tools</a></div>
            </div>
        </div>
    </footer>

    <script>
        

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // LCS-based line diff
        function lcs(a, b) {
            const m = a.length, n = b.length;
            const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
            for (let i = 1; i <= m; i++)
                for (let j = 1; j <= n; j++)
                    dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);

            const result = [];
            let i = m, j = n;
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
                    result.unshift({type:'equal', line: a[i-1], ln_a: i, ln_b: j});
                    i--; j--;
                } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
                    result.unshift({type:'added', line: b[j-1], ln_b: j});
                    j--;
                } else {
                    result.unshift({type:'removed', line: a[i-1], ln_a: i});
                    i--;
                }
            }
            return result;
        }

        function runDiff() {
            const a = document.getElementById('textA').value;
            const b = document.getElementById('textB').value;
            if (!a && !b) return;

            const linesA = a.split('\n');
            const linesB = b.split('\n');
            const diff = lcs(linesA, linesB);

            let added = 0, removed = 0, unchanged = 0;
            const CONTEXT = 3;

            // Find lines to show (context around changes)
            const changed = diff.map((d,i) => d.type !== 'equal');
            const show = new Set();
            for (let i = 0; i < diff.length; i++) {
                if (changed[i]) {
                    for (let j = Math.max(0,i-CONTEXT); j <= Math.min(diff.length-1,i+CONTEXT); j++) show.add(j);
                }
            }

            let html = '';
            let lastShown = -1;
            for (let i = 0; i < diff.length; i++) {
                const d = diff[i];
                if (d.type === 'added') added++;
                else if (d.type === 'removed') removed++;
                else unchanged++;

                if (!show.has(i)) continue;
                if (lastShown !== -1 && i > lastShown + 1) {
                    html += `<div class="diff-line context-sep"><div class="diff-sign"></div><div class="diff-content">@@ ${i - lastShown - 1} Zeilen ausgeblendet @@</div></div>`;
                }
                lastShown = i;

                const ln = d.type === 'added' ? (d.ln_b || '') :
                           d.type === 'removed' ? (d.ln_a || '') :
                           (d.ln_a || '');
                const sign = d.type === 'added' ? '+' : d.type === 'removed' ? '−' : '';
                html += `<div class="diff-line ${d.type}">
                    <div class="diff-ln">${ln}</div>
                    <div class="diff-sign">${sign}</div>
                    <div class="diff-content">${escHtml(d.line)}</div>
                </div>`;
            }

            document.getElementById('addedCount').textContent = added;
            document.getElementById('removedCount').textContent = removed;
            document.getElementById('unchangedStat').textContent = unchanged + ' unverändert';
            document.getElementById('diffLines').innerHTML = html;
            document.getElementById('diffOutput').style.display = 'block';

            const status = document.getElementById('status');
            if (added === 0 && removed === 0) {
                status.textContent = 'Die Texte sind identisch.';
                status.className = 'status info';
            } else {
                status.textContent = 'Vergleich abgeschlossen: +' + added + ' / −' + removed;
                status.className = 'status ok';
                setTimeout(() => { status.className = 'status'; }, 3000);
            }
        }

        function clearAll() {
            document.getElementById('textA').value = '';
            document.getElementById('textB').value = '';
            document.getElementById('diffOutput').style.display = 'none';
            document.getElementById('status').className = 'status';
        }

        function swapTexts() {
            const a = document.getElementById('textA');
            const b = document.getElementById('textB');
            const tmp = a.value;
            a.value = b.value;
            b.value = tmp;
        }
    </script>
</body>
</html>
