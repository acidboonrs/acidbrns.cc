<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DNS Lookup – DNS-Records für Domains abfragen via Cloudflare DoH">
    <meta name="theme-color" content="#00ff88">
    <title>DNS Lookup – tools.acidbrns.cc</title>
<link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="https://acidbrns.cc/favicon.svg">
</head>
<body>
    <div class="noise"></div>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="https://tools.acidbrns.cc" class="back-link" title="Zurück zu Tools">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                </a>
                <a href="https://tools.acidbrns.cc" class="logo"><span class="logo-accent">&gt;</span>acidbrns<span class="logo-divider">/</span>tools<span class="logo-divider">/</span>dns</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">DNS Lookup</h1>
                <p class="page-desc">DNS-Records für jede Domain abfragen. Nutzt Cloudflare DNS-over-HTTPS (1.1.1.1) – verschlüsselt, kein ISP-Sniffing.</p>
            </div>

            <div class="search-row">
                <input type="text" class="domain-input" id="domain" placeholder="acidbrns.cc" onkeydown="if(event.key==='Enter')lookup()">
                <button class="btn btn-primary" onclick="lookup()">Abfragen</button>
            </div>

            <div class="type-grid" id="typeGrid">
                <button class="type-btn active" data-type="ALL" onclick="selectType(this)">ALL</button>
                <button class="type-btn" data-type="A" onclick="selectType(this)">A</button>
                <button class="type-btn" data-type="AAAA" onclick="selectType(this)">AAAA</button>
                <button class="type-btn" data-type="MX" onclick="selectType(this)">MX</button>
                <button class="type-btn" data-type="TXT" onclick="selectType(this)">TXT</button>
                <button class="type-btn" data-type="CNAME" onclick="selectType(this)">CNAME</button>
                <button class="type-btn" data-type="NS" onclick="selectType(this)">NS</button>
                <button class="type-btn" data-type="SOA" onclick="selectType(this)">SOA</button>
                <button class="type-btn" data-type="SRV" onclick="selectType(this)">SRV</button>
                <button class="type-btn" data-type="CAA" onclick="selectType(this)">CAA</button>
            </div>

            <div id="status" class="status"></div>
            <div class="results" id="results"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p class="copyright">© 2026 acidbrns.cc</p>
                <div class="footer-links"><a href="https://tools.acidbrns.cc">Alle Tools</a></div>
            </div>
        </div>
    </footer>

    <script>
        
        let selectedType = 'ALL';

        const TYPES = ['A','AAAA','MX','TXT','CNAME','NS','SOA','SRV','CAA'];
        const TYPE_NAMES = {1:'A',2:'NS',5:'CNAME',6:'SOA',12:'PTR',15:'MX',16:'TXT',28:'AAAA',33:'SRV',257:'CAA'};

        function selectType(btn) {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedType = btn.dataset.type;
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + type;
            if (type === 'ok') setTimeout(() => { el.className = 'status'; }, 3000);
        }

        function formatTTL(ttl) {
            if (ttl >= 3600) return (ttl/3600).toFixed(0) + 'h';
            if (ttl >= 60) return (ttl/60).toFixed(0) + 'm';
            return ttl + 's';
        }

        function formatData(record) {
            switch(record.type) {
                case 1: case 28: return record.data;
                case 15: return record.data; // MX includes priority
                case 16: return record.data.replace(/^"|"$/g,'');
                case 5: return record.data;
                case 6: return record.data;
                case 2: return record.data;
                case 33: return record.data;
                case 257: return record.data;
                default: return record.data || JSON.stringify(record);
            }
        }

        async function queryType(domain, type) {
            const url = `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=${type}`;
            const res = await fetch(url, { headers: { 'Accept': 'application/dns-json' } });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            return data.Answer || [];
        }

        async function lookup() {
            let domain = document.getElementById('domain').value.trim().toLowerCase();
            domain = domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
            if (!domain) return showStatus('Bitte Domain eingeben.', 'err');

            document.getElementById('results').innerHTML = '';
            showStatus('Abfrage läuft...', 'ok');

            try {
                const typesToQuery = selectedType === 'ALL' ? TYPES : [selectedType];
                const queries = typesToQuery.map(t => queryType(domain, t).catch(() => []));
                const results = await Promise.all(queries);
                const allRecords = results.flat();

                document.getElementById('status').className = 'status';

                if (allRecords.length === 0) {
                    showStatus('Keine DNS-Records gefunden für ' + domain, 'err');
                    return;
                }

                // Group by type
                const grouped = {};
                for (const record of allRecords) {
                    const typeName = TYPE_NAMES[record.type] || 'TYPE' + record.type;
                    if (!grouped[typeName]) grouped[typeName] = [];
                    grouped[typeName].push(record);
                }

                const resultsEl = document.getElementById('results');
                for (const [type, records] of Object.entries(grouped)) {
                    const group = document.createElement('div');
                    group.className = 'record-group';
                    group.innerHTML = `
                        <div class="record-group-header">
                            <span class="record-type">${type}</span>
                            <span class="record-count">${records.length} Record${records.length !== 1 ? 's' : ''}</span>
                        </div>
                        ${records.map(r => `
                            <div class="record-row">
                                <span class="record-ttl">${formatTTL(r.TTL)}</span>
                                <span class="record-data">${escHtml(formatData(r))}</span>
                            </div>`).join('')}`;
                    resultsEl.appendChild(group);
                }

                showStatus('Abfrage abgeschlossen: ' + allRecords.length + ' Records für ' + domain, 'ok');
            } catch(e) {
                showStatus('Fehler: ' + e.message, 'err');
            }
        }

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
    </script>
</body>
</html>
