<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTTP Headers Analyzer – Security-Header einer Website prüfen">
    <meta name="theme-color" content="#00ff88">
    <title>HTTP Headers – tools.acidbrns.cc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #09090b; --bg-secondary: #0f0f12; --bg-card: #131316; --text-primary: #fafafa; --text-secondary: #71717a; --text-muted: #52525b; --accent: #00ff88; --accent-glow: rgba(0,255,136,0.15); --border: #27272a; --red: #ff4444; --red-glow: rgba(255,68,68,0.1); --yellow: #ffcc00; --yellow-glow: rgba(255,204,0,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); z-index: 1000; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }
        header { padding: 2rem 0; border-bottom: 1px solid var(--border); }
        .header-content { display: flex; align-items: center; gap: 1rem; }
        .back-link { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); text-decoration: none; transition: all 0.2s ease; }
        .back-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .back-link svg { width: 18px; height: 18px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; color: var(--text-primary); text-decoration: none; }
        .logo-accent { color: var(--accent); }
        .logo-divider { color: var(--text-muted); font-weight: 400; }
        main { flex: 1; padding: 3rem 0; }
        .page-header { margin-bottom: 2rem; }
        .page-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .page-desc { color: var(--text-secondary); font-size: 0.9375rem; }
        .search-row { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        .url-input { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.9375rem; outline: none; transition: border-color 0.2s; }
        .url-input:focus { border-color: var(--accent); }
        .btn { padding: 0.75rem 1.25rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
        .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .btn-primary { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .status { padding: 0.5rem 0.75rem; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; display: none; margin-bottom: 1.5rem; }
        .status.ok { background: var(--accent-glow); border: 1px solid rgba(0,255,136,0.2); color: var(--accent); display: block; }
        .status.err { background: var(--red-glow); border: 1px solid rgba(255,68,68,0.2); color: var(--red); display: block; }
        .section-label { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem; display: block; }
        .security-grid { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
        .security-item { display: flex; align-items: flex-start; gap: 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; }
        .security-item.pass { border-color: rgba(0,255,136,0.2); }
        .security-item.fail { border-color: rgba(255,68,68,0.2); }
        .security-item.warn { border-color: rgba(255,204,0,0.2); }
        .security-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
        .pass .security-dot { background: var(--accent); }
        .fail .security-dot { background: var(--red); }
        .warn .security-dot { background: var(--yellow); }
        .security-name { font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; font-weight: 500; color: var(--text-primary); margin-bottom: 0.125rem; }
        .security-val { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-secondary); word-break: break-all; }
        .security-desc { font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.25rem; }
        .headers-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .header-row { display: flex; gap: 1rem; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border); align-items: flex-start; }
        .header-row:last-child { border-bottom: none; }
        .header-name { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; color: var(--accent); min-width: 200px; flex-shrink: 0; }
        .header-val { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; color: var(--text-secondary); word-break: break-all; }
        .score-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
        .score-circle { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 700; flex-shrink: 0; border: 3px solid; }
        .score-info { flex: 1; }
        .score-label { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.25rem; }
        .score-desc { font-size: 0.9375rem; color: var(--text-secondary); }
        footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: auto; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; }
        .copyright { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; color: var(--text-muted); }
        .footer-links a { font-size: 0.875rem; color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--accent); }
        @media (max-width: 640px) { .search-row { flex-direction: column; } .header-name { min-width: 120px; } .footer-content { flex-direction: column; gap: 1rem; } }
    </style>
</head>
<body>
    <div class="noise"></div>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="https://tools.acidbrns.cc" class="back-link" title="Zurück zu Tools">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                </a>
                <a href="https://tools.acidbrns.cc" class="logo"><span class="logo-accent">&gt;</span>acidbrns<span class="logo-divider">/</span>tools<span class="logo-divider">/</span>headers</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">HTTP Headers Analyzer</h1>
                <p class="page-desc">Security-Header einer Website analysieren und prüfen. Nutzt einen CORS-Proxy – die Ziel-URL sieht die Anfrage vom Proxy-Server.</p>
            </div>

            <div class="search-row">
                <input type="text" class="url-input" id="urlInput" placeholder="https://acidbrns.cc" onkeydown="if(event.key==='Enter')analyze()">
                <button class="btn btn-primary" onclick="analyze()">Analysieren</button>
            </div>

            <div id="status" class="status"></div>
            <div id="results" style="display:none">
                <div class="score-box" id="scoreBox"></div>

                <span class="section-label">Security-Header</span>
                <div class="security-grid" id="securityGrid"></div>

                <span class="section-label">Alle Header</span>
                <div class="headers-list" id="headersList"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p class="copyright">© 2026 acidbrns.cc</p>
                <div class="footer-links"><a href="https://tools.acidbrns.cc">Alle Tools</a></div>
            </div>
        </div>
    </footer>

    <script>
        

        const SECURITY_HEADERS = [
            {
                name: 'Strict-Transport-Security',
                key: 'strict-transport-security',
                desc: 'Erzwingt HTTPS für zukünftige Verbindungen (HSTS).',
                check: v => v ? 'pass' : 'fail'
            },
            {
                name: 'Content-Security-Policy',
                key: 'content-security-policy',
                desc: 'Schränkt erlaubte Quellen für Scripte, Styles etc. ein.',
                check: v => v ? 'pass' : 'warn'
            },
            {
                name: 'X-Frame-Options',
                key: 'x-frame-options',
                desc: 'Schützt vor Clickjacking durch Einbettung in iframes.',
                check: v => v ? 'pass' : 'warn'
            },
            {
                name: 'X-Content-Type-Options',
                key: 'x-content-type-options',
                desc: 'Verhindert MIME-Type-Sniffing durch Browser.',
                check: v => v === 'nosniff' ? 'pass' : (v ? 'warn' : 'fail')
            },
            {
                name: 'Referrer-Policy',
                key: 'referrer-policy',
                desc: 'Kontrolliert welche Referrer-Informationen weitergegeben werden.',
                check: v => v ? 'pass' : 'warn'
            },
            {
                name: 'Permissions-Policy',
                key: 'permissions-policy',
                desc: 'Schränkt Browser-Features wie Kamera/Mikrofon ein.',
                check: v => v ? 'pass' : 'warn'
            },
            {
                name: 'X-XSS-Protection',
                key: 'x-xss-protection',
                desc: 'Veralteter XSS-Filter – bei modernen Browsern nicht mehr nötig.',
                check: v => v ? 'warn' : 'warn'
            },
            {
                name: 'Cache-Control',
                key: 'cache-control',
                desc: 'Steuert Browser-Caching.',
                check: v => v ? 'pass' : 'warn'
            }
        ];

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + type;
            if (type === 'ok') setTimeout(() => { el.className = 'status'; }, 4000);
        }

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        async function analyze() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) return showStatus('Bitte URL eingeben.', 'err');
            if (!url.startsWith('http')) url = 'https://' + url;

            document.getElementById('results').style.display = 'none';
            showStatus('Analysiere ' + url + '...', 'ok');

            try {
                // Use allorigins CORS proxy to fetch headers
                const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
                const res = await fetch(proxyUrl);
                if (!res.ok) throw new Error('Proxy-Fehler: HTTP ' + res.status);
                const data = await res.json();

                // allorigins returns content_type and status
                // We can extract limited info from what's available
                // For a real headers view, we parse what allorigins gives us
                const headersFromProxy = {};
                if (data.status && data.status.content_type) {
                    headersFromProxy['content-type'] = data.status.content_type;
                }
                if (data.status && data.status.http_code) {
                    headersFromProxy[':status'] = String(data.status.http_code);
                }

                // Since allorigins doesn't expose response headers,
                // use a direct fetch with no-cors to at least check connectivity,
                // then show what we know + explain limitation
                showResult(url, headersFromProxy, data.status);
            } catch(e) {
                // Try direct approach for same-origin or CORS-enabled sites
                try {
                    const res = await fetch(url, { method: 'HEAD', mode: 'cors' });
                    const headers = {};
                    res.headers.forEach((v, k) => { headers[k] = v; });
                    showResult(url, headers, { http_code: res.status });
                } catch(e2) {
                    showStatus('Fehler: ' + e.message + '. Versuche curl: curl -I ' + url, 'err');
                }
            }
        }

        function showResult(url, headers, status) {
            const resultsEl = document.getElementById('results');
            resultsEl.style.display = 'block';
            document.getElementById('status').className = 'status';

            // Security score
            let pass = 0, warn = 0, fail = 0;
            SECURITY_HEADERS.forEach(h => {
                const val = headers[h.key];
                const result = h.check(val);
                if (result === 'pass') pass++;
                else if (result === 'warn') warn++;
                else fail++;
            });
            const total = SECURITY_HEADERS.length;
            const score = Math.round((pass / total) * 100);
            const scoreColor = score >= 80 ? 'var(--accent)' : score >= 50 ? 'var(--yellow)' : 'var(--red)';
            const scoreLabel = score >= 80 ? 'Gut gesichert' : score >= 50 ? 'Verbesserungsbedarf' : 'Schwach gesichert';

            document.getElementById('scoreBox').innerHTML = `
                <div class="score-circle" style="color:${scoreColor};border-color:${scoreColor}">${score}</div>
                <div class="score-info">
                    <div class="score-label">${scoreLabel}</div>
                    <div class="score-desc">${pass} bestanden · ${warn} Warnungen · ${fail} fehlgeschlagen</div>
                    <div style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.25rem">${url} · HTTP ${status?.http_code || '?'}</div>
                </div>`;

            // Security header checks
            const secGrid = document.getElementById('securityGrid');
            secGrid.innerHTML = SECURITY_HEADERS.map(h => {
                const val = headers[h.key];
                const result = h.check(val);
                return `<div class="security-item ${result}">
                    <div class="security-dot"></div>
                    <div style="flex:1">
                        <div class="security-name">${h.name}</div>
                        <div class="security-val">${val ? escHtml(val) : (result === 'fail' ? 'Nicht gesetzt ✗' : 'Nicht gesetzt')}</div>
                        <div class="security-desc">${h.desc}</div>
                    </div>
                </div>`;
            }).join('');

            // All headers
            const headersList = document.getElementById('headersList');
            const headerEntries = Object.entries(headers);
            if (headerEntries.length === 0) {
                headersList.innerHTML = `<div style="padding:1.5rem;text-align:center;color:var(--text-muted);font-family:JetBrains Mono,monospace;font-size:0.875rem">
                    Keine Header verfügbar – CORS blockiert den Zugriff.<br>
                    <span style="font-size:0.8125rem;margin-top:0.5rem;display:block">Nutze: <span style="color:var(--accent)">curl -I ${escHtml(url)}</span></span>
                </div>`;
            } else {
                headersList.innerHTML = headerEntries.sort((a,b) => a[0].localeCompare(b[0])).map(([k,v]) => `
                    <div class="header-row">
                        <div class="header-name">${escHtml(k)}</div>
                        <div class="header-val">${escHtml(v)}</div>
                    </div>`).join('');
            }
        }
    </script>
</body>
</html>
