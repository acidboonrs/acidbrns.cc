<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JSON Formatter – JSON formatieren, validieren und minifizieren">
    <meta name="theme-color" content="#00ff88">
    <title>JSON Formatter – tools.acidbrns.cc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-primary: #09090b; --bg-secondary: #0f0f12; --bg-card: #131316; --text-primary: #fafafa; --text-secondary: #71717a; --text-muted: #52525b; --accent: #00ff88; --accent-glow: rgba(0,255,136,0.15); --border: #27272a; --red: #ff4444; --red-glow: rgba(255,68,68,0.1); --blue: #60a5fa; --orange: #fb923c; --purple: #c084fc; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); z-index: 1000; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; width: 100%; }
        header { padding: 2rem 0; border-bottom: 1px solid var(--border); }
        .header-content { display: flex; align-items: center; gap: 1rem; }
        .back-link { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); text-decoration: none; transition: all 0.2s ease; }
        .back-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .back-link svg { width: 18px; height: 18px; }
        .logo { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; color: var(--text-primary); text-decoration: none; }
        .logo-accent { color: var(--accent); }
        .logo-divider { color: var(--text-muted); font-weight: 400; }
        main { flex: 1; padding: 3rem 0; }
        .page-header { margin-bottom: 2rem; }
        .page-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .page-desc { color: var(--text-secondary); font-size: 0.9375rem; }
        .editor-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .panel { display: flex; flex-direction: column; }
        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
        .section-label { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
        .panel-actions { display: flex; gap: 0.375rem; }
        textarea { width: 100%; height: 400px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; resize: vertical; outline: none; transition: border-color 0.2s; tab-size: 2; }
        textarea:focus { border-color: var(--accent); }
        .output-area { width: 100%; height: 400px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; overflow: auto; white-space: pre; }
        .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .btn { padding: 0.625rem 1.25rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; cursor: pointer; transition: all 0.2s ease; }
        .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .btn-primary { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
        .btn-secondary { color: var(--text-secondary); }
        .small-btn { padding: 0.25rem 0.625rem; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; }
        .small-btn:hover { border-color: var(--accent); color: var(--accent); }
        .status { padding: 0.5rem 0.75rem; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; display: none; margin-bottom: 1rem; }
        .status.ok { background: var(--accent-glow); border: 1px solid rgba(0,255,136,0.2); color: var(--accent); display: block; }
        .status.err { background: var(--red-glow); border: 1px solid rgba(255,68,68,0.2); color: var(--red); display: block; }
        .indent-select { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 0.375rem 0.625rem; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; cursor: pointer; outline: none; }
        .indent-select:focus { border-color: var(--accent); }
        .stats { display: flex; gap: 1.5rem; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); }
        .stat-item strong { color: var(--text-secondary); }
        /* syntax highlighting */
        .json-key { color: var(--blue); }
        .json-string { color: var(--accent); }
        .json-number { color: var(--orange); }
        .json-bool { color: var(--purple); }
        .json-null { color: var(--text-muted); }
        footer { border-top: 1px solid var(--border); padding: 1.5rem 0; margin-top: auto; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; }
        .copyright { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; color: var(--text-muted); }
        .footer-links a { font-size: 0.875rem; color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--accent); }
        @media (max-width: 768px) { .editor-layout { grid-template-columns: 1fr; } textarea, .output-area { height: 250px; } .footer-content { flex-direction: column; gap: 1rem; } }
    </style>
</head>
<body>
    <div class="noise"></div>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="https://tools.acidbrns.cc" class="back-link" title="Zurück zu Tools">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
                </a>
                <a href="https://tools.acidbrns.cc" class="logo"><span class="logo-accent">&gt;</span>acidbrns<span class="logo-divider">/</span>tools<span class="logo-divider">/</span>json</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">JSON Formatter</h1>
                <p class="page-desc">JSON formatieren, validieren, minifizieren und mit Syntax-Highlighting anzeigen. Vollständig client-seitig.</p>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" onclick="format()">Formatieren</button>
                <button class="btn btn-secondary" onclick="minify()">Minifizieren</button>
                <button class="btn btn-secondary" onclick="validate()">Validieren</button>
                <button class="btn btn-secondary" onclick="clearAll()">✕ Leeren</button>
                <select class="indent-select" id="indentSize" onchange="format()">
                    <option value="2">2 Spaces</option>
                    <option value="4">4 Spaces</option>
                    <option value="	">Tab</option>
                </select>
            </div>

            <div id="status" class="status"></div>

            <div class="editor-layout">
                <div class="panel">
                    <div class="panel-header">
                        <span class="section-label">Eingabe</span>
                        <div class="panel-actions">
                            <button class="small-btn" onclick="pasteFromClipboard()">einfügen</button>
                            <button class="small-btn" onclick="clearInput()">leeren</button>
                        </div>
                    </div>
                    <textarea id="input" placeholder='{"key": "value", "array": [1, 2, 3]}' oninput="liveValidate()"></textarea>
                </div>
                <div class="panel">
                    <div class="panel-header">
                        <span class="section-label">Ausgabe</span>
                        <div class="panel-actions">
                            <button class="small-btn" onclick="copyOutput()">kopieren</button>
                            <button class="small-btn" onclick="useAsInput()">als Eingabe</button>
                        </div>
                    </div>
                    <div class="output-area" id="output"></div>
                </div>
            </div>

            <div class="stats" id="stats" style="display:none">
                <div class="stat-item"><strong id="statKeys">0</strong> Keys</div>
                <div class="stat-item"><strong id="statChars">0</strong> Zeichen</div>
                <div class="stat-item"><strong id="statLines">0</strong> Zeilen</div>
                <div class="stat-item"><strong id="statSize">0</strong> Bytes</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p class="copyright">© 2026 acidbrns.cc</p>
                <div class="footer-links"><a href="https://tools.acidbrns.cc">Alle Tools</a></div>
            </div>
        </div>
    </footer>

    <script>
        

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + type;
            if (type === 'ok') setTimeout(() => { el.className = 'status'; }, 3000);
        }

        function getIndent() {
            const val = document.getElementById('indentSize').value;
            return val === '\t' ? '\t' : parseInt(val);
        }

        function highlight(json) {
            return json
                .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
                    if (/^"/.test(m)) {
                        if (/:$/.test(m)) return `<span class="json-key">${escHtml(m)}</span>`;
                        return `<span class="json-string">${escHtml(m)}</span>`;
                    }
                    if (/true|false/.test(m)) return `<span class="json-bool">${m}</span>`;
                    if (/null/.test(m)) return `<span class="json-null">${m}</span>`;
                    return `<span class="json-number">${m}</span>`;
                });
        }

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function countKeys(obj, count = 0) {
            if (typeof obj === 'object' && obj !== null) {
                for (const k in obj) { count++; count = countKeys(obj[k], count); }
            }
            return count;
        }

        function updateStats(parsed, formatted) {
            const stats = document.getElementById('stats');
            stats.style.display = 'flex';
            document.getElementById('statKeys').textContent = countKeys(parsed);
            document.getElementById('statChars').textContent = formatted.length;
            document.getElementById('statLines').textContent = formatted.split('\n').length;
            document.getElementById('statSize').textContent = new TextEncoder().encode(formatted).length;
        }

        function format() {
            const input = document.getElementById('input').value.trim();
            if (!input) return;
            try {
                const parsed = JSON.parse(input);
                const formatted = JSON.stringify(parsed, null, getIndent());
                document.getElementById('output').innerHTML = highlight(escHtml(formatted).split('\n').join('\n'));
                updateStats(parsed, formatted);
                showStatus('Gültiges JSON – ' + formatted.split('\n').length + ' Zeilen', 'ok');
            } catch(e) {
                showStatus('JSON-Fehler: ' + e.message, 'err');
            }
        }

        function minify() {
            const input = document.getElementById('input').value.trim();
            if (!input) return;
            try {
                const parsed = JSON.parse(input);
                const minified = JSON.stringify(parsed);
                document.getElementById('output').innerHTML = highlight(escHtml(minified));
                updateStats(parsed, minified);
                showStatus('Minifiziert: ' + minified.length + ' Zeichen', 'ok');
            } catch(e) {
                showStatus('JSON-Fehler: ' + e.message, 'err');
            }
        }

        function validate() {
            const input = document.getElementById('input').value.trim();
            if (!input) return showStatus('Bitte JSON eingeben.', 'err');
            try {
                JSON.parse(input);
                showStatus('✓ Gültiges JSON', 'ok');
            } catch(e) {
                showStatus('✗ Ungültiges JSON: ' + e.message, 'err');
            }
        }

        function liveValidate() {
            const input = document.getElementById('input').value.trim();
            const status = document.getElementById('status');
            if (!input) { status.className = 'status'; return; }
            try {
                JSON.parse(input);
                status.className = 'status';
            } catch(e) {
                status.textContent = e.message;
                status.className = 'status err';
            }
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').innerHTML = '';
            document.getElementById('status').className = 'status';
            document.getElementById('stats').style.display = 'none';
        }

        function clearInput() {
            document.getElementById('input').value = '';
            document.getElementById('status').className = 'status';
        }

        function copyOutput() {
            const text = document.getElementById('output').innerText;
            if (!text) return showStatus('Nichts zum Kopieren.', 'err');
            navigator.clipboard.writeText(text).then(() => showStatus('Kopiert!', 'ok'));
        }

        function useAsInput() {
            const text = document.getElementById('output').innerText;
            if (!text) return;
            document.getElementById('input').value = text;
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('input').value = text;
                liveValidate();
            } catch(e) {
                showStatus('Zugriff auf Zwischenablage verweigert.', 'err');
            }
        }
    </script>
</body>
</html>
