<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{{ delay }};url={{ next }}">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Redirecting…</title>
<style>
  :root { --green:#5cdb5c; --dim:#3a7a3a; --line:#24351f; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#0c0f0c; }
  body {
    font-family:"DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
    color:#e6e6e6; display:flex; align-items:flex-start; justify-content:center;
  }
  .wall {
    width:min(1100px, 94vw); margin-top:6vh; padding:42px 38px;
    background:#10160f; border:1px solid var(--line); border-radius:4px;
  }
  h1 { color:var(--green); font-weight:700; font-size:42px; margin:0 0 22px; letter-spacing:1px; }
  p  { font-size:18px; line-height:1.5; margin:0 0 18px; }
  .sub { color:#cfcfcf; font-size:15px; }
  a  { color:var(--green); text-decoration:none; }
  a:hover { text-decoration:underline; }
  hr { border:0; border-top:1px solid var(--line); margin:54px 0 14px; }
  .rayid { color:var(--dim); font-size:13px; letter-spacing:1px; }
  .rayid b { color:var(--green); }
  noscript { display:block; }
</style>
</head>
<body>
  <main class="wall" role="main">
    <h1>Redirecting</h1>
    <p>DDoS protection is active. You will be redirected automatically in {{ delay }} seconds.</p>
    <p class="sub">Or click <a href="{{ next }}">here</a> if that doesn&#39;t happen automatically&nbsp;…</p>
    <hr>
    <div class="rayid">ACIDWALL RAYID: <b>{{ rayid }}</b></div>
  </main>
</body>
</html>
